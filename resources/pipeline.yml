resources:
  pipelines:
    meridian_dlt_pipeline:
      name: "[${bundle.target}] meridian_${var.trainee}_pipeline"
      catalog: ${var.catalog}
      target: bronze
      channel: "preview"
      serverless: true
      configuration:
        catalog: ${var.catalog}
        pipeline.catalog: ${var.catalog}
        trainee: ${var.trainee}
      libraries:
        - notebook:
            path: ../src/pipeline/00_bronze.ipynb 
        - notebook:
            path: ../src/pipeline/01_silver.ipynb
        - notebook:
            path: ../src/pipeline/02_gold.ipynb
      continuous: false
      development: false