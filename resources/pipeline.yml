resources:
  pipelines:
    meridian_dlt_pipeline:
      name: "[${bundle.target}] meridian_${var.trainee}_pipeline"
      target: ${var.catalog}.silver
      catalog: ${var.catalog}
      channel: "preview"
      serverless: true
      libraries:
        - notebook:
            path: ../src/pipeline/01_silver.py # Adjust to exact file name in your pipeline folder
        - notebook:
            path: ../src/pipeline/02_gold.py   # Adjust to exact file name in your pipeline folder
      continuous: false
      development: false