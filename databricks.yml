bundle:
  name: meridian_t12

variables:
  catalog:
    description: "Target Unity Catalog"
    default: "meridian_t12"
  trainee:
    description: "Trainee identifier"
    default: "t12"
  warehouse_id:
    description: "SQL Warehouse ID for metric views"
    default: "63a6b2c83ed6e9a2"

targets:
  dev:
    default: true
    mode: development
    variables:
      catalog: "meridian_t12"
    workspace:
      host: https://dbc-8dadb92d-21bb.cloud.databricks.com/
    resources:
      jobs:
        meridian_orchestration_job:
          schedule:
            pause_status: PAUSED

  prod:
    mode: production
    variables:
      catalog: "meridian_t12"
    workspace:
      host: https://dbc-8dadb92d-21bb.cloud.databricks.com/
    resources:
      jobs:
        meridian_orchestration_job:
          schedule:
            pause_status: UNPAUSED

include:
  - "resources/*.yml"